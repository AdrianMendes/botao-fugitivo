```html
<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Botão Fugitivo</title>

    <style>
        body {
            margin: 0;
            height: 100vh;
            background: #111;
            color: white;
            font-family: Arial, sans-serif;

            display: flex;
            justify-content: center;
            align-items: center;
        }

        .caixa {
            text-align: center;
        }

        h1 {
            margin-bottom: 30px;
        }

        button {
            padding: 15px 30px;
            margin: 10px;
            border: none;
            border-radius: 8px;
            font-size: 18px;
            cursor: pointer;
        }

        #sim {
            background: crimson;
            color: white;
        }

        #nao {
            background: #444;
            color: white;

            position: relative;
        }

        #mensagem {
            margin-top: 25px;
            font-size: 20px;
        }
    </style>
</head>

<body>

    <div class="caixa">

        <h1>Concorda que é tudo culpa da amaia? 😏</h1>

        <button id="sim" onclick="aceitou()">
            SIM ❤️
        </button>

        <button id="nao">
            NÃO ❌
        </button>

        <p id="mensagem"></p>

    </div>

    <script>

        const botaoNao = document.getElementById("nao");

        botaoNao.addEventListener("mouseover", function() {

            const largura = window.innerWidth - botaoNao.offsetWidth;
            const altura = window.innerHeight - botaoNao.offsetHeight;

            const novaPosicaoX = Math.random() * largura;
            const novaPosicaoY = Math.random() * altura;

            botaoNao.style.position = "fixed";
            botaoNao.style.left = novaPosicaoX + "px";
            botaoNao.style.top = novaPosicaoY + "px";

        });

        function aceitou() {

            document.getElementById("mensagem").innerHTML =
                "Eu sabia que você ia escolher SIM! 😂❤️";

        }

    </script>

</body>

</html>
